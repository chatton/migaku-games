# docker compose up -d                  (or: podman compose up -d)
# docker compose --profile steam up -d  also OCRs every new Steam screenshot (steam-watcher)
#
# Uses the image CI publishes to GHCR (private: `docker login ghcr.io` first); `--build`
# builds it from this checkout instead.
services:
  migaku-games:
    image: ghcr.io/chatton/migaku-games:latest
    build: .
    ports:
      - "127.0.0.1:8765:8765"   # localhost only; the capture client and browser are on this machine
    volumes:
      - ./data:/data            # frames
      - ./config:/config:ro     # config.yaml: edit, then "Reload config" in the web UI. The folder,
                                # not the file, so editors that save by replacing it still work
      - ./web:/app/web:ro       # live UI edits without a rebuild
    security_opt:
      - label=disable   # SELinux (Bazzite/Fedora): allow the bind mounts without relabelling them
    restart: unless-stopped

  # Optional: OCR every new Steam screenshot (F12). Set STEAM_DIR in .env if Steam isn't at
  # ~/.local/share/Steam (Flatpak: ~/.var/app/com.valvesoftware.Steam/.local/share/Steam).
  steam-watcher:
    profiles: [steam]
    image: ghcr.io/chatton/migaku-games:latest
    depends_on: [migaku-games]
    command: ["python", "steam_watcher.py", "--steam", "/steam", "--server", "http://migaku-games:8765"]
    volumes:
      - ${STEAM_DIR:-${HOME}/.local/share/Steam}:/steam:ro
    security_opt:
      - label=disable
    restart: unless-stopped
