<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Frame picture</title>
<!-- The viewer shows the screenshot through this page in an iframe. A document with no text
     in it is where Migaku's "hover image + E" sends the image to the card creator; on the
     viewer page itself E sends the hovered sentence instead. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<img id="shot" alt="">
<script>
const frame = new URLSearchParams(location.search).get("frame");
document.getElementById("shot").src = `frames/${frame}/shot.png`;
// Keep the viewer's shortcuts working after a click puts focus in this frame.
addEventListener("keydown", (e) => {
  const { key, altKey, metaKey, ctrlKey, shiftKey } = e;
  parent.dispatchEvent(new KeyboardEvent("keydown", { key, altKey, metaKey, ctrlKey, shiftKey }));
});
</script>
</body>
</html>
