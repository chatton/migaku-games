<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migaku Frames</title>
<style>
  :root {
    --bg: #0e1015; --panel: #171a21; --line: #262a33; --fg: #e8e9ec; --muted: #8a8f99;
    --accent: #7aa2ff; --danger: #ff6b6b; --pin: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 12px 16px; background: rgba(14, 16, 21, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 17px; font-weight: 650; }
  .meta { color: var(--muted); }
  .spacer { flex: 1; }
  label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  input[type=number], select {
    width: 72px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px;
  }
  select { width: auto; }
  button, .btn {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; font: inherit; text-decoration: none;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  main { padding: 16px; }
  #drop {
    border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted);
    margin-bottom: 16px;
  }
  #drop.over { border-color: var(--accent); color: var(--fg); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card.pinned { border-color: var(--pin); }
  .card a.thumb { display: block; aspect-ratio: 16 / 10; background: #000 center / contain no-repeat; }
  .card .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .preview { font-family: "Hiragino Sans", "Noto Sans CJK JP", sans-serif; font-size: 15px; min-height: 2.8em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .row .spacer { flex: 1; }
  .row button { padding: 3px 8px; font-size: 12px; }
  .row button.pin-on { color: var(--pin); border-color: var(--pin); }
  .row button.del:hover { color: var(--danger); border-color: var(--danger); }
  #empty { color: var(--muted); text-align: center; padding: 40px 0; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel);
    border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Migaku Frames</h1>
  <span class="meta" id="count"></span>
  <span class="spacer"></span>
  <label>Game <select id="game"><option value="">All</option></select></label>
  <label>OCR <select id="engine"></select></label>
  <label>Keep frames <input type="number" id="retention" min="0" step="1"> hours</label>
  <span class="meta">(0 = forever · pinned frames are always kept)</span>
</header>
<main>
  <div id="drop">Drop or paste a screenshot here, or <button id="pick">choose a file</button>, to OCR it
    <input type="file" id="file" accept="image/*" hidden></div>
  <div id="grid"></div>
  <div id="empty" hidden>No frames yet. Capture one with <code>python3 migaku_games.py</code>.</div>
</main>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const api = async (path, opts = {}) => {
  const res = await fetch(path, opts);
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : null;
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
};
const toast = (msg) => {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $("toast").classList.remove("show"), 2500);
};

function ago(t) {
  const s = Date.now() / 1000 - t;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return new Date(t * 1000).toLocaleDateString();
}
function expiresIn(t) {
  if (t == null) return "kept";
  const h = (t - Date.now() / 1000) / 3600;
  return h < 1 ? `expires in ${Math.max(1, Math.round(h * 60))} min` : `expires in ${Math.round(h)} h`;
}

let lastJson = "";
async function refresh() {
  const all = await api("/api/frames");
  const json = JSON.stringify(all) + $("game").value;
  if (json === lastJson) return;
  lastJson = json;
  // Game filter: the games present, keeping the current choice.
  const games = [...new Set(all.map((f) => f.game).filter(Boolean))].sort();
  const chosen = $("game").value;
  $("game").replaceChildren(new Option("All", ""), ...games.map((g) => new Option(g, g, false, g === chosen)));
  const frames = chosen ? all.filter((f) => f.game === chosen) : all;
  $("count").textContent = `${frames.length} frame${frames.length === 1 ? "" : "s"}`;
  $("empty").hidden = frames.length > 0;
  const grid = $("grid");
  grid.replaceChildren(...frames.map((f) => {
    const card = document.createElement("div");
    card.className = "card" + (f.pinned ? " pinned" : "");
    const url = `/viewer.html?frame=${f.id}`;
    card.innerHTML = `
      <a class="thumb" href="${url}"></a>
      <div class="body">
        <div class="preview" lang="ja"></div>
        <div class="row"><span class="info"></span></div>
        <div class="row">
          <span>${expiresIn(f.expires)}</span><span class="spacer"></span>
          <button class="pin ${f.pinned ? "pin-on" : ""}">${f.pinned ? "Pinned" : "Pin"}</button>
          <button class="del">Delete</button>
        </div>
      </div>`;
    card.querySelector(".thumb").style.backgroundImage = `url(/frames/${f.id}/shot.png)`;
    card.querySelector(".preview").textContent = f.preview || "(no text)";
    card.querySelector(".info").textContent = [f.game, ago(f.created), f.engine, `${f.lines} lines`].filter(Boolean).join(" · ");
    card.querySelector(".pin").onclick = async () => {
      await api(`/api/frames/${f.id}/pin`, { method: "PUT", body: JSON.stringify({ pinned: !f.pinned }) });
      refresh();
    };
    card.querySelector(".del").onclick = async () => {
      if (!confirm("Delete this frame?")) return;
      await api(`/api/frames/${f.id}`, { method: "DELETE" });
      refresh();
    };
    return card;
  }));
}

async function loadConfig() {
  const cfg = await api("/api/config");
  $("retention").value = cfg.retention_hours;
  $("engine").replaceChildren(...cfg.engines.map((e) => {
    const o = document.createElement("option");
    o.value = o.textContent = e;
    o.selected = e === cfg.engine;
    return o;
  }));
}
$("retention").onchange = async () => {
  try {
    const r = await api("/api/config", { method: "PUT", body: JSON.stringify({ retention_hours: Number($("retention").value) }) });
    toast(r.retention_hours ? `Keeping frames for ${r.retention_hours} h` : "Keeping frames forever");
    lastJson = "";
    refresh();
  } catch (e) { toast("⚠ " + e.message); }
};

// Upload: drop, paste or pick an image; it's OCR'd with the selected engine.
async function uploadFile(file) {
  if (!file || !file.type.startsWith("image/")) return toast("Not an image");
  toast("OCR running…");
  try {
    const r = await api(`/api/frames?ocr=${$("engine").value}`, { method: "POST", body: file });
    location.href = r.url;
  } catch (e) { toast("⚠ " + e.message); }
}
const drop = $("drop");
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); uploadFile(e.dataTransfer.files[0]); };
addEventListener("paste", (e) => uploadFile([...e.clipboardData.files][0]));
$("pick").onclick = () => $("file").click();
$("file").onchange = () => uploadFile($("file").files[0]);

$("game").onchange = refresh;
loadConfig();
refresh();
setInterval(refresh, 5000);  // new captures from the hotkey/CLI show up on their own
</script>
</body>
</html>
