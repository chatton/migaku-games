name: docker

# Tests run on every push (any branch or tag); images are published only for v* tags.
on:
  push:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile migaku_games.py migaku_host/*.py pipeline.py server.py config.py align.py tools/build_jmdict.py ocr/meiki_ocr.py tests/*.py
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: migaku-games:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit tests
        run: docker run --rm -v "$PWD:/src" -w /src migaku-games:ci python -m unittest -v tests.test_config tests.test_align
      - name: Smoke test
        run: |
          mkdir "$RUNNER_TEMP/config" && cp config/config.yaml "$RUNNER_TEMP/config/"
          docker run -d --name migaku -p 8765:8765 -v "$RUNNER_TEMP/config:/config" migaku-games:ci
          python tests/smoke_test.py http://localhost:8765 "$RUNNER_TEMP/config"
      - name: Server logs
        if: always()
        run: docker logs migaku || true

  # The hotkey client runs on the player's own machine: check it on several Linux distributions,
  # bare and with desktop tools (tests/check_host_distro.sh).
  host:
    name: host (${{ matrix.image }}, ${{ matrix.tools }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "ubuntu:24.04", "debian:stable-slim", "archlinux:latest", "alpine:latest"]
        tools: [none, desktop]
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "${{ matrix.image }}" sh -c '
            set -e
            case "$0" in
              fedora*) pm="dnf install -y -q"; base="python3"; extra="grim scrot xdotool libnotify";;
              ubuntu*|debian*) apt-get update -qq; pm="apt-get install -y -qq --no-install-recommends"; base="python3"; extra="grim scrot xdotool libnotify-bin";;
              arch*) pm="pacman -Sy --noconfirm --quiet --disable-sandbox"; base="python"; extra="grim scrot xdotool libnotify";;
              alpine*) pm="apk add -q"; base="python3"; extra="grim scrot xdotool libnotify";;
            esac
            $pm $base
            if [ "$1" = desktop ]; then $pm $extra; fi
            tests/check_host_distro.sh "$1"' "${{ matrix.image }}" "${{ matrix.tools }}"

  # The native server via the install script (install.sh -> tools/native.sh): install without a
  # service, run it, smoke-test it.
  native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the scripts
        run: shellcheck install.sh tools/native.sh
      - name: Install
        run: ./install.sh --native --no-service
      - name: Smoke test
        run: |
          tools/native.sh run > "$RUNNER_TEMP/server.out" 2>&1 &
          python tests/smoke_test.py http://localhost:8765
          tools/native.sh status
      - name: Server log
        if: always()
        run: cat data/logs/server.log || true

  # Images are published only for version tags (git tag v1.2.3 && git push --tags).
  publish:
    needs: [test, host, native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
